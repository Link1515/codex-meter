[package]
name = "codex-meter"
version = "0.1.0"
description = "Desktop Codex usage meter"
authors = ["Codex Meter contributors"]
edition = "2021"

[lib]
name = "codex_meter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

